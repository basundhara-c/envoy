syntax = "proto3";

package test.integration.clusters;

message CustomStaticConfig1 {
  uint32 priority = 1;
  string address = 2;
  uint32 port_value = 3;
  // Opt the cluster into persistent host partitions and add its host as a delta.
  bool use_persistent_host_partitions = 4;
}

message CustomStaticConfig2 {
  uint32 priority = 1;
  string address = 2;
  uint32 port_value = 3;
  // Opt the cluster into persistent host partitions and add its host as a delta.
  bool use_persistent_host_partitions = 4;
}
